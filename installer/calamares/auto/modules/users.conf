---
# Alleen gebruikt door /etc/calamares-auto (geautomatiseerde VM-test).
userGroup: users

user:
    shell: /bin/zsh

defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - tty
    - dialout

autologinGroup: autologin
sudoersGroup: sudo
sudoersConfigureWithGroup: false

setRootPassword: false
doReusePassword: false

displayAutologin: true
doAutologin: true

# De test vult geen wachtwoord in; het wachtwoord wordt na de
# gebruikersmodule met shellprocess@test-password gezet.
passwordRequirements:
    minLength: -1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

presets:
    fullName:
        value: "LinuxBeOS Test"
        editable: false
    loginName:
        value: "testuser"
        editable: false
