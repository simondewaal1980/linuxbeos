---
# Testvariant: dezelfde services als productie, plus de Btrfs-testdienst.
# De dienst doet alleen iets als het SMBIOS-seriënnummer
# LINUXBEOS-AUTOINSTALL is; op een normaal geïnstalleerd systeem stopt hij
# direct.
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "lightdm.service"
      action: "enable"
      mandatory: true
    - name: "graphical.target"
      action: "enable"
    - name: "snapper-timeline.timer"
      action: "enable"
      mandatory: true
    - name: "snapper-cleanup.timer"
      action: "enable"
      mandatory: true
    - name: "grub-btrfs.service"
      action: "enable"
      mandatory: false
    - name: "grub-btrfs.path"
      action: "enable"
      mandatory: false
    - name: "linuxbeos-btrfs-test.service"
      action: "enable"
      mandatory: true
