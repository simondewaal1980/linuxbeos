---
# Alleen gebruikt door /etc/calamares-auto (geautomatiseerde VM-test).
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# De test installeert op Btrfs en test daarmee ook de @swap-subvolume.
userSwapChoices:
    - none
    - file

# De test schrijft de volledige schijf vol; er is maar één schijf in de VM.
initialPartitioningChoice: erase
initialSwapChoice: file
allowManualPartitioning: false

defaultFileSystemType: "btrfs"
luksGeneration: luks2
enableLuksAutomatedPartitioning: false
preCheckEncryption: false

createHybridBootloaderLayout: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true

lvm:
    enable: false

essentialMounts: [ "live-*", "control", "ventoy" ]
