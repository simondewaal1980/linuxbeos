# Testvariant van settings.conf voor de geautomatiseerde installatietest.
#
# Wordt alleen gebruikt als de live-ISO met het SMBIOS-kenmerk
# LINUXBEOS-AUTOINSTALL start. De keten is identiek aan de normale
# installatie; alleen partition/users zijn voorgeselecteerd en Calamares
# sluit zichzelf af na de installatie.

modules-search: [ local ]

instances:
  - id: target-cleanup
    module: shellprocess
    config: shellprocess-target-cleanup.conf
  - id: test-password
    module: shellprocess
    config: shellprocess-test-password.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - shellprocess@test-password
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - shellprocess@target-cleanup
      - umount
  - show:
      - finished

branding: linuxbeos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: true
