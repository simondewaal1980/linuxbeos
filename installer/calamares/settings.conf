# Calamares-instellingen voor LinuxBeOS (fase 1).
#
# Standaardmoduleketen voor een live-installatie op één schijf:
# partitioneren -> mounts -> squashfs uitpakken -> fstab -> locale ->
# toetsenbord -> gebruiker -> displaymanager -> netwerk -> bootloader.
# Na de installatie wordt Calamares zelf uit het doelsysteem verwijderd.
#
# De configuratie staat onder /etc/calamares; de testvariant
# (linuxbeos-autoinstall) gebruikt /etc/calamares-auto met dezelfde
# moduleketen en voorgeselecteerde waarden.

modules-search: [ local ]

instances:
  - id: target-cleanup
    module: shellprocess
    config: shellprocess-target-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - shellprocess@target-cleanup
      - umount
  - show:
      - finished

branding: linuxbeos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
