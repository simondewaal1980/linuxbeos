---
# Fase 2 installeert standaard op Btrfs met subvolumes. Ext4 blijft
# beschikbaar via handmatige partitionering; LUKS en LVM zijn nog niet
# ondersteund en daarom uitgeschakeld.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# Een swapfile op Btrfs komt in de aparte @swap-subvolume zonder CoW.
# Gebruikers kunnen ook zonder swap installeren.
userSwapChoices:
    - none
    - file

initialPartitioningChoice: none
initialSwapChoice: file

defaultFileSystemType: "btrfs"
luksGeneration: luks2
enableLuksAutomatedPartitioning: false
preCheckEncryption: false

allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true

lvm:
    enable: false

# De live-ISO gebruikt deze mounts; laat ze met rust tijdens het opschonen.
essentialMounts: [ "live-*", "control", "ventoy" ]
