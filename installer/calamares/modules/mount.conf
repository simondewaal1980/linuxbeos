---
# Extra mounts die tijdens de installatie in het doel systeem nodig zijn.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]

# Btrfs-subvolumes (fase 2). Calamares maakt ze aan op de root-partitie en
# schrijft daarna per mountpoint een fstab-regel met subvol=... De namen
# moeten overeenkomen met BTRFS_*_SUBVOL in config/project.conf; de
# statische test controleert dat.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log
    - mountPoint: /var/cache
      subvolume: /@var_cache

# Alleen gebruikt als de gebruiker een swapfile kiest. Calamares maakt dan
# /@swap aan en zet het swapfile daar neer zonder CoW (chattr +C).
btrfsSwapSubvol: /@swap

# Mountopties die de mount-module gebruikt en die de fstab-module overneemt.
# compress=zstd staat op de root-subvolumes; de swap-subvolume krijgt geen
# compressie en geen noatime.
mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
