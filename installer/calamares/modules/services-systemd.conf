---
# Services die in het doelsysteem ingeschakeld moeten zijn.
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "lightdm.service"
      action: "enable"
      mandatory: true
    - name: "graphical.target"
      action: "enable"
    # Snapper: tijdlijn-snapshots en dagelijkse opruiming. De apt-hook wordt
    # door het snapper-pakket geïnstalleerd en is actief zodra
    # /etc/snapper/configs/root bestaat.
    - name: "snapper-timeline.timer"
      action: "enable"
      mandatory: true
    - name: "snapper-cleanup.timer"
      action: "enable"
      mandatory: true
    # GRUB-menu met Btrfs-snapshots: bij elke boot en bij wijzigingen in
    # /.snapshots wordt grub-mkconfig opnieuw uitgevoerd.
    - name: "grub-btrfs.service"
      action: "enable"
      mandatory: false
    - name: "grub-btrfs.path"
      action: "enable"
      mandatory: false
