---
# GRUB-configuratie in het doel systeem.
# console=ttyS0 maakt de geautomatiseerde boottest van het geïnstalleerde
# systeem mogelijk en is tegelijk nuttige nooddiagnostiek.
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "console=ttyS0,115200" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
