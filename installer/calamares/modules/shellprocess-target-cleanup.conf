---
# Laatste opschoning van het doelsysteem. Deze module draait in de chroot
# van het doel; ${ROOT} is daar "/".
dontChroot: false
timeout: 60

script:
    # Calamares-configuratie en testhulpjes horen niet in het eindproduct.
    - "rm -rf /etc/calamares /etc/calamares-auto"
    - "rm -f /usr/share/applications/linuxbeos-installer.desktop"
    - "rm -f /etc/skel/Desktop/install-linuxbeos.desktop"
    - "rm -f /home/${USER}/Desktop/install-linuxbeos.desktop"
    - "rm -f /etc/xdg/autostart/linuxbeos-autoinstall.desktop"
    - "rm -f /usr/local/bin/linuxbeos-autoinstall"
    # De Btrfs-testhulp hoort alleen in de testvariant. De testvariant
    # overschrijft dit bestand met een versie die de hulp laat staan.
    - "rm -f /usr/local/bin/linuxbeos-btrfs-test"
    - "rm -f /etc/systemd/system/linuxbeos-btrfs-test.service"
    - "rm -f /etc/systemd/system/multi-user.target.wants/linuxbeos-btrfs-test.service"
    # De live-autologin geldt alleen voor de live-sessie. Calamares schrijft
    # zo nodig een autologin voor de nieuwe gebruiker in lightdm.conf.
    - "rm -f /etc/lightdm/lightdm.conf.d/99-linuxbeos-autologin.conf"
