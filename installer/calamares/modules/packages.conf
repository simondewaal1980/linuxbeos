---
# Verwijder de live-omgeving en Calamares uit het doelsysteem.
# De apt-backend draait in het doel (chroot) en gebruikt de al aanwezige
# pakketlijsten; er is geen netwerk nodig voor het verwijderen.
backend: apt

operations:
    - remove:
          - calamares
          - live-boot
          - live-config
          - live-config-systemd
          - live-tools
