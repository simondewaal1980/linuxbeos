---
userGroup: users

# Fase 3: ZSH is de standaardshell voor nieuwe gebruikers. Root blijft bash.
user:
    shell: /bin/zsh

defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - tty
    - dialout

autologinGroup: autologin
sudoersGroup: sudo
sudoersConfigureWithGroup: false

setRootPassword: false
doReusePassword: false

displayAutologin: true
doAutologin: false

passwordRequirements:
    minLength: 6
    maxLength: -1
