#!/bin/sh
# Centrale configuratie voor het LinuxBeOS-project.
#
# Dit bestand wordt door de scripts gesourced (POSIX sh). Houd het daarom
# vrij van bash-specifieke syntax en van commando's met bijwerkingen.
#
# Wijzig hier de distronaam, versie, mirror en VM-instellingen; alle scripts
# lezen deze waarden uit zodat er geen tweede bron van waarheid ontstaat.

# --- Identiteit -----------------------------------------------------------
DISTRO_NAME="LinuxBeOS"
DISTRO_SLUG="linuxbeos"
DISTRO_VERSION="0.1"
DISTRO_STATUS="development"
DISTRO_TAGLINE="Een open-source desktop in de geest van BeOS 5"

# --- Debian-basis ---------------------------------------------------------
DEBIAN_SUITE="sid"
DEBIAN_ARCH="amd64"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_ARCHIVE_AREAS="main contrib non-free non-free-firmware"

# --- Live-sessie ----------------------------------------------------------
LIVE_USER="live"
LIVE_HOSTNAME="linuxbeos"
LIVE_LOCALE="en_US.UTF-8"
LIVE_KEYBOARD="us"
LIVE_TIMEZONE="Etc/UTC"

# Console op tty0 én ttyS0: de seriële console is nodig voor de
# geautomatiseerde rooktesten in tests/.
LIVE_BOOTAPPEND="boot=live components username=${LIVE_USER} hostname=${LIVE_HOSTNAME} locales=${LIVE_LOCALE} keyboard-layouts=${LIVE_KEYBOARD} timezone=${LIVE_TIMEZONE} console=tty0 console=ttyS0,115200 systemd.show_status=1"

# --- ISO ------------------------------------------------------------------
ISO_NAME="${DISTRO_SLUG}-${DISTRO_VERSION}-${DEBIAN_ARCH}.iso"
ISO_VOLUME="LINUXBEOS"

# --- Build-VM (directe QEMU/KVM, geen libvirt) ----------------------------
BUILD_VM_NAME="${DISTRO_SLUG}-build"
BUILD_VM_CPUS="4"
BUILD_VM_MEMORY_MB="6144"
BUILD_VM_DISK_GB="40"
BUILD_VM_SSH_PORT="2222"
BUILD_VM_SSH_USER="builder"
BUILD_VM_SSH_PASSWORD="linuxbeos"
BUILD_VM_SRC_DIR="/home/builder/${DISTRO_SLUG}-src"
BUILD_VM_WORKDIR="/home/builder/${DISTRO_SLUG}-build"
BUILD_VM_BASE_URL="https://cloud.debian.org/images/cloud/sid/daily/latest/debian-sid-genericcloud-amd64-daily.qcow2"

# --- Btrfs (fase 2) -------------------------------------------------------
BTRFS_SUBVOLUMES="@ @home @snapshots @var_log @var_cache @swap"
SNAPPER_CONFIG="root"
