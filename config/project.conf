#!/bin/sh
# Centrale configuratie voor het LinuxBeOS-project.
#
# Dit bestand wordt door de scripts gesourced (POSIX sh). Houd het daarom
# vrij van bash-specifieke syntax en van commando's met bijwerkingen.
#
# Wijzig hier de distronaam, versie, mirror en VM-instellingen; alle scripts
# lezen deze waarden uit zodat er geen tweede bron van waarheid ontstaat.

# --- Identiteit -----------------------------------------------------------
DISTRO_NAME="LinuxBeOS"
DISTRO_SLUG="linuxbeos"
DISTRO_VERSION="0.1"
DISTRO_STATUS="development"
DISTRO_TAGLINE="Een open-source desktop in de geest van BeOS 5"

# --- Debian-basis ---------------------------------------------------------
DEBIAN_SUITE="sid"
DEBIAN_ARCH="amd64"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_ARCHIVE_AREAS="main contrib non-free non-free-firmware"

# --- Live-sessie ----------------------------------------------------------
LIVE_USER="live"
LIVE_HOSTNAME="linuxbeos"
LIVE_LOCALE="en_US.UTF-8"
LIVE_KEYBOARD="us"
LIVE_TIMEZONE="Etc/UTC"

# Console op tty0 én ttyS0: de seriële console is nodig voor de
# geautomatiseerde rooktesten in tests/.
LIVE_BOOTAPPEND="boot=live components username=${LIVE_USER} hostname=${LIVE_HOSTNAME} locales=${LIVE_LOCALE} keyboard-layouts=${LIVE_KEYBOARD} timezone=${LIVE_TIMEZONE} console=tty0 console=ttyS0,115200 systemd.show_status=1"

# --- Extra software (fase 3) ----------------------------------------------
# Opencode wordt als losse CLI-binary meegeleverd. De versie staat hier vast
# zodat een rebuild dezelfde download gebruikt; de SHA256 wordt tijdens de
# build gecontroleerd voordat de binary in de ISO belandt.
OPENCODE_VERSION="1.19.5"
OPENCODE_SHA256_AMD64="588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a"
OPENCODE_URL_AMD64="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"

# Google Chrome wordt uit de officiële stabiele repository geïnstalleerd.
# De pakketversie drijft mee met Google; de repository en keyring worden in
# de chroot-hook 0400-apps.chroot geconfigureerd.
GOOGLE_CHROME_CHANNEL="stable"
GOOGLE_CHROME_REPO="https://dl.google.com/linux/chrome/deb/"

# --- ISO ------------------------------------------------------------------
ISO_NAME="${DISTRO_SLUG}-${DISTRO_VERSION}-${DEBIAN_ARCH}.iso"
ISO_VOLUME="LINUXBEOS"

# --- Build-VM (directe QEMU/KVM, geen libvirt) ----------------------------
BUILD_VM_NAME="${DISTRO_SLUG}-build"
BUILD_VM_CPUS="4"
BUILD_VM_MEMORY_MB="6144"
BUILD_VM_DISK_GB="40"
BUILD_VM_SSH_PORT="2222"
BUILD_VM_SSH_USER="builder"
BUILD_VM_SSH_PASSWORD="linuxbeos"
BUILD_VM_SRC_DIR="/home/builder/${DISTRO_SLUG}-src"
BUILD_VM_WORKDIR="/home/builder/${DISTRO_SLUG}-build"
BUILD_VM_BASE_URL="https://cloud.debian.org/images/cloud/sid/daily/latest/debian-sid-genericcloud-amd64-daily.qcow2"

# --- Btrfs (fase 2) -------------------------------------------------------
# Subvolumes worden door Calamares' mount-module aangemaakt. De namen hier
# zijn de enige bron van waarheid; de statische test controleert of
# installer/calamares/modules/mount.conf dezelfde namen gebruikt.
BTRFS_ROOT_SUBVOL="@"
BTRFS_HOME_SUBVOL="@home"
BTRFS_SNAPSHOTS_SUBVOL="@snapshots"
BTRFS_VAR_LOG_SUBVOL="@var_log"
BTRFS_VAR_CACHE_SUBVOL="@var_cache"
BTRFS_SWAP_SUBVOL="@swap"
BTRFS_SUBVOLUMES="${BTRFS_ROOT_SUBVOL} ${BTRFS_HOME_SUBVOL} ${BTRFS_SNAPSHOTS_SUBVOL} ${BTRFS_VAR_LOG_SUBVOL} ${BTRFS_VAR_CACHE_SUBVOL} ${BTRFS_SWAP_SUBVOL}"
BTRFS_SNAPSHOTS_MOUNT="/.snapshots"
BTRFS_COMPRESS="zstd"
BTRFS_MOUNT_OPTIONS="defaults,noatime,compress=${BTRFS_COMPRESS}"

# Snapper beheert snapshots van de root-subvolume. De configuratie wordt
# tijdens de build naar /etc/snapper/configs/${SNAPPER_CONFIG} gekopieerd.
SNAPPER_CONFIG="root"
SNAPPER_TIMELINE_LIMIT_HOURLY="5"
SNAPPER_TIMELINE_LIMIT_DAILY="7"
SNAPPER_TIMELINE_LIMIT_WEEKLY="4"
SNAPPER_TIMELINE_LIMIT_MONTHLY="6"
SNAPPER_TIMELINE_LIMIT_YEARLY="0"
