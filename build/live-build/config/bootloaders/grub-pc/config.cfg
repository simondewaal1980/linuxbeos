# LinuxBeOS: override van live-build's grub-pc/config.cfg.
#
# De standaardsjabloon uit live-build 20250814 doet `insmod efi_uga`, maar
# grub-efi-amd64-bin 2.14 in Debian Sid levert efi_uga.mod niet meer. Dat
# laat GRUB EFI stoppen voordat het menu verschijnt. We laten de module weg
# en gebruiken de overgebleven video-backends.

set default=0
# Automatisch verder na 3 seconden; zonder timeout blijft GRUB oneindig
# op het menu wachten (live-build's sjabloon zet geen timeout).
set timeout=3
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

if [ -f /boot/grub/theme.cfg ]; then
    source /boot/grub/theme.cfg
fi

terminal_output gfxterm
